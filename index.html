<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notre capteur</title>
<!-- Chart.js : Chargement robuste de la bibliothèque -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
body {
  font-family: system-ui, sans-serif; color: #1b2420; background: #f6f7f6;
  max-width: 900px; margin: 0 auto; padding: 16px;
}
h1 { margin-bottom: 4px; }
.carte {
  background: #fff; border: 1px solid #d6ddd8; border-radius: 8px;
  padding: 12px 16px; margin: 16px 0;
}
#valeurs { display: flex; flex-wrap: wrap; gap: 24px; }
.valeur b { display: block; font-size: 1.8rem; }
#etat { color: #5a6a60; font-weight: 500; }
#etat.erreur { color: #b3261e; }
</style>
</head>
<body>
<h1>Notre capteur</h1>
<p>Mesures envoyées par la carte du groupe au serveur AirCarto.</p>
<p>
 Période :
 <select id="periode">
  <option value="-6h">6 dernières heures</option>
  <option value="-24h" selected>24 dernières heures</option>
  <option value="-7d">7 derniers jours</option>
 </select>
</p>
<p id="etat">Chargement en cours...</p>
<div class="carte">
 <h2>Dernière mesure</h2>
 <div id="valeurs">En attente des données...</div>
</div>
<div class="carte">
 <h2>Particules (µg/m³)</h2>
 <canvas id="graphe-pm"></canvas>
</div>
<div class="carte">
 <h2>Température (°C) et humidité (%)</h2>
 <canvas id="graphe-meteo"></canvas>
</div>
<div class="carte" id="carte-co2">
 <h2>CO₂ (ppm)</h2>
 <canvas id="graphe-co2"></canvas>
</div>

 temp: ["Température", "°C"], hum: ["Humidité", "%"], co2: ["CO₂", "ppm"],
};
