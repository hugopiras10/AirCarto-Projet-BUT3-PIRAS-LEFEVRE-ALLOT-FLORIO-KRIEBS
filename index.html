<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModuleAir Mini - Tableau de Bord Temps Réel</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #f5f5f5; margin: 0; padding: 20px; }
    .header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 20px; }
    .controls { display: flex; align-items: center; gap: 15px; }
    select { background: #1e1e1e; color: #fff; border: 1px solid #444; padding: 8px 12px; border-radius: 6px; font-size: 0.95rem; cursor: pointer; }
    select:focus { outline: none; border-color: #00e5ff; }
    .status { font-size: 0.9rem; color: #4caf50; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 10px; text-align: center; border-top: 4px solid #333; transition: background-color 0.3s; }
    .card h3 { margin: 0 0 10px; font-size: 0.9rem; color: #aaa; }
    .card .val { font-size: 2rem; font-weight: bold; }
    .chart-container { background: #1e1e1e; padding: 20px; border-radius: 10px; height: 350px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>ModuleAir Mini</h1>
    <div class="controls">
      <select id="timeframeSelect">
        <option value="1h" selected>Dernière heure</option>
        <option value="8h">Dernières 8 heures</option>
        <option value="24h">Dernières 24 heures</option>
        <option value="7d">Derniers 7 jours</option>
      </select>
      <div class="status" id="status">Initialisation...</div>
    </div>
  </div>

  <!-- Cartes des valeurs actuelles -->
  <div class="grid">
    <div class="card" id="card-co2">
      <h3>CO₂ (ppm)</h3>
      <div class="val" id="val-co2">--</div>
    </div>
    <div class="card" id="card-pm25">
      <h3>PM2.5 (µg/m³)</h3>
      <div class="val" id="val-pm25">--</div>
    </div>
    <div class="card" id="card-pm10">
      <h3>PM10 (µg/m³)</h3>
      <div class="val" id="val-pm10">--</div>
    </div>
    <div class="card">
      <h3>Température / Hum.</h3>
      <div class="val" id="val-th" style="font-size: 1.5rem; margin-top: 8px;">--</div>
    </div>
  </div>

  <!-- Graphique dynamique -->
  <div class="chart-container">
    <canvas id="airChart"></canvas>
  </div>

  <script>
    // 1. CONFIGURATION DE VOTRE CAPTEUR
    const API_URL = "https://api.aircarto.fr/iut-amu/data"; // Adapter selon l'URL exacte de lecture
    const DEVICE_ID = "5C:01:3B:F1:53:C8"; // Adresse MAC de votre ESP32
    const GROUP_KEY = "1fdf17de86d313e5f49e03ab36f0360b";
    const REFRESH_INTERVAL_MS = 15000; // Actualisation automatique toutes les 15 secondes

    let pollingTimer = null;

    // 2. INITIALISATION DU GRAPHIQUE
    const ctx = document.getElementById('airChart').getContext('2d');
    const airChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'CO₂ (ppm)', data: [], borderColor: '#00e5ff', yAxisID: 'y1', tension: 0.3 },
          { label: 'PM2.5 (µg/m³)', data: [], borderColor: '#ff9100', yAxisID: 'y', tension: 0.3 },
          { label: 'PM10 (µg/m³)', data: [], borderColor: '#ff1744', yAxisID: 'y', tension: 0.3 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 400 },
        scales: {
          x: { ticks: { color: '#aaa' }, grid: { color: '#333' } },
          y: { type: 'linear', position: 'left', ticks: { color: '#aaa' }, grid: { color: '#333' }, title: { display: true, text: 'Particules (µg/m³)', color: '#aaa' } },
          y1: { type: 'linear', position: 'right', ticks: { color: '#00e5ff' }, grid: { drawOnChartArea: false }, title: { display: true, text: 'CO₂ (ppm)', color: '#00e5ff' } }
        },
        plugins: { legend: { labels: { color: '#fff' } } }
      }
    });

    function updateCardColor(cardId, val, seuilMoyen, seuilCritique) {
      const card = document.getElementById(cardId);
      if (val > seuilCritique) {
        card.style.borderTopColor = '#ff1744';
        card.style.backgroundColor = '#3b1212';
      } else if (val >= seuilMoyen) {
        card.style.borderTopColor = '#ff9100';
        card.style.backgroundColor = '#1e1e1e';
      } else {
        card.style.borderTopColor = '#00e676';
        card.style.backgroundColor = '#1e1e1e';
      }
    }

    // 3. RÉCUPÉRATION CONTINUE DES DONNÉES
    async function fetchData() {
      const mode = document.getElementById('timeframeSelect').value;
      const statusEl = document.getElementById('status');

      try {
        const response = await fetch(`${API_URL}?device_id=${DEVICE_ID}&period=${mode}`, {
          headers: { 'X-Group-Key': GROUP_KEY }
        });
        if (!response.ok) throw new Error(`Erreur HTTP ${response.status}`);
        
        const data = await response.json();
        const measures = Array.isArray(data) ? data : [data];
        if (measures.length === 0) return;

        const latest = measures[measures.length - 1];

        // Mise à jour des cartes du haut avec les dernières valeurs en direct
        if (latest.co2 !== undefined) {
          document.getElementById('val-co2').textContent = latest.co2;
          updateCardColor('card-co2', latest.co2, 800, 1000);
        }
        if (latest.pm25 !== undefined) {
          document.getElementById('val-pm25').textContent = latest.pm25.toFixed(1);
          updateCardColor('card-pm25', latest.pm25, 15, 25);
        }
        if (latest.pm10 !== undefined) {
          document.getElementById('val-pm10').textContent = latest.pm10.toFixed(1);
          updateCardColor('card-pm10', latest.pm10, 45, 50);
        }
        if (latest.temp !== undefined && latest.hum !== undefined) {
          document.getElementById('val-th').textContent = `${latest.temp.toFixed(1)}°C / ${latest.hum.toFixed(0)}%`;
        }

        // Mise à jour des étiquettes et des courbes du graphique
        airChart.data.labels = measures.map(m => {
          const d = m.timestamp ? new Date(m.timestamp * 1000) : new Date();
          return (mode === '7d' || mode === '24h')
            ? d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
            : d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        });

        airChart.data.datasets[0].data = measures.map(m => m.co2 ?? null);
        airChart.data.datasets[1].data = measures.map(m => m.pm25 ?? null);
        airChart.data.datasets[2].data = measures.map(m => m.pm10 ?? null);
        airChart.update('none'); // Mise à jour fluide sans animation de rechargement visible

        const heure = new Date().toLocaleTimeString('fr-FR');
        statusEl.textContent = `● En direct (${mode}) • Maj : ${heure}`;
        statusEl.style.color = '#4caf50';

      } catch (err) {
        statusEl.textContent = `Erreur de connexion (${err.message})`;
        statusEl.style.color = '#ff5252';
      }
    }

    // 4. GESTION DES CHANGEMENTS DE PLAGE HORAIRE ET DU TEMPS RÉEL GLOBAL
    function initRealtimePolling() {
      if (pollingTimer) {
        clearInterval(pollingTimer);
      }
      // Chargement immédiat
      fetchData();
      // Relance de l'actualisation automatique toutes les 15 secondes, peu importe le choix de la période
      pollingTimer = setInterval(fetchData, REFRESH_INTERVAL_MS);
    }

    document.getElementById('timeframeSelect').addEventListener('change', initRealtimePolling);

    // Lancement au démarrage de la page
    initRealtimePolling();
  </script>
</body>
</html>
