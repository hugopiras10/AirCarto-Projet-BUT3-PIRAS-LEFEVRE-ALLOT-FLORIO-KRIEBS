<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notre capteur - ModuleAir</title>
<!-- Chart.js et son adaptateur de dates -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
body {
  font-family: system-ui, sans-serif; color: #1b2420; background: #f6f7f6;
  max-width: 900px; margin: 0 auto; padding: 16px;
}
h1 { margin-bottom: 4px; }
.carte {
  background: #fff; border: 1px solid #d6ddd8; border-radius: 8px;
  padding: 12px 16px; margin: 16px 0;
}
.filtres-ligne {
  display: flex; gap: 16px; align-items: center; margin-bottom: 10px; font-size: 0.9rem;
}
.filtres-ligne label {
  cursor: pointer; display: flex; align-items: center; gap: 5px; font-weight: 500;
}
#valeurs { display: flex; flex-wrap: wrap; gap: 24px; }
.valeur b { display: block; font-size: 1.8rem; }
#etat { color: #5a6a60; font-weight: 500; }
#etat.erreur { color: #b3261e; }
</style>
</head>
<body>
<h1>Notre capteur</h1>
<p>Mesures envoyées par la carte ModuleAir mini sur le serveur AirCarto.</p>

<p>
 Période :
 <select id="periode">
  <option value="-24h" selected>24 dernières heures</option>
  <option value="-7d">7 derniers jours</option>
 </select>
</p>

<p id="etat">Chargement en cours...</p>

<div class="carte">
 <h2>Dernière mesure</h2>
 <div id="valeurs">En attente des données...</div>
</div>

<!-- Graphe PM avec ses propres filtres -->
<div class="carte" id="carte-pm">
 <h2>Particules (µg/m³)</h2>
 <div class="filtres-ligne">
  <span>Afficher :</span>
  <label><input type="checkbox" class="filtre-pm" value="pm1" checked> PM1</label>
  <label><input type="checkbox" class="filtre-pm" value="pm25" checked> PM2.5</label>
  <label><input type="checkbox" class="filtre-pm" value="pm10" checked> PM10</label>
 </div>
 <canvas id="graphe-pm"></canvas>
</div>

<!-- Graphe Météo avec ses propres filtres -->
<div class="carte" id="carte-meteo">
 <h2>Température (°C) et humidité (%)</h2>
 <div class="filtres-ligne">
  <span>Afficher :</span>
  <label><input type="checkbox" class="filtre-meteo" value="temp" checked> Température</label>
  <label><input type="checkbox" class="filtre-meteo" value="hum" checked> Humidité</label>
 </div>
 <canvas id="graphe-meteo"></canvas>
</div>

<!-- Graphe CO2 -->
<div class="carte" id="carte-co2">
 <h2>CO₂ (ppm)</h2>
 <canvas id="graphe-co2"></canvas>
</div>

<script>
// ---------- RÉGLAGES : Mettez votre clé de groupe ici ----------
const CLE = "1fdf17de86d313e5f49e03ab36f0360b";               // Remplacez par votre clé de groupe (32 caractères)
const DEVICE_ID = "5C:01:3B:F1:53:C8";  // Identifiant unique de votre ESP32

// Fréquence adaptée selon la période
const MOYENNE = { "-24h": "1m", "-7d": "5m" };

// Nom affiché et unité de chaque champ de l'API
const CHAMPS = {
 pm1: ["PM1", "µg/m³"], pm25: ["PM2.5", "µg/m³"], pm10: ["PM10", "µg/m³"],
 temp: ["Température", "°C"], hum: ["Humidité", "%"], co2: ["CO₂", "ppm"],
};

const graphes = {};
let pointsGlobal = [];

// Convertit proprement le timestamp (secondes -> millisecondes JS)
function parseDate(timeValue) {
  if (typeof timeValue === 'number') {
    return new Date(timeValue * 1000);
  }
  if (!isNaN(timeValue) && typeof timeValue === 'string' && timeValue.trim() !== '') {
    return new Date(Number(timeValue) * 1000);
  }
  return new Date(timeValue);
}

// Récupère les champs cochés pour une classe donnée
function getCoches(classe) {
  return Array.from(document.querySelectorAll('.' + classe + ':checked')).map(cb => cb.value);
}

// Demande les mesures au serveur et trie chronologiquement
async function chargerMesures(periode) {
 const params = new URLSearchParams({ key: CLE, start: periode, freq: MOYENNE[periode] });
 if (DEVICE_ID) params.set("device_id", DEVICE_ID);
 
 const url = "https://api.aircarto.fr/iut-amu/data?" + params.toString();
 const reponse = await fetch(url);
 
 if (!reponse.ok) {
   throw new Error("Erreur HTTP : " + reponse.status);
 }
 
 const json = await reponse.json();
 if (!json.ok) {
   throw new Error(json.message || "Erreur renvoyée par l'API");
 }
 
 let points = json.points || [];
 points.sort((a, b) => parseDate(a.time).getTime() - parseDate(b.time).getTime());
 return points;
}

// Dessine un graphe spécifique en fonction de ses propres cases cochées
function dessinerGraphe(idCanvas, idCarte, points, champsCibles, champsDispo) {
 const carteDiv = document.getElementById(idCarte);

 if (champsCibles.length === 0) {
   if (carteDiv) carteDiv.hidden = true;
   if (graphes[idCanvas]) { graphes[idCanvas].destroy(); graphes[idCanvas] = null; }
   return 0;
 }

 if (carteDiv) carteDiv.hidden = false;
 
 const courbes = champsCibles.map(c => ({
   label: CHAMPS[c][0],
   data: points.map(p => ({
     x: parseDate(p.time),
     y: p[c] ?? null
   })),
   pointRadius: points.length < 30 ? 4 : 2,
   borderWidth: 2,
   spanGaps: true
 }));

 if (graphes[idCanvas]) {
   graphes[idCanvas].destroy();
 }
 
 const ctx = document.getElementById(idCanvas);
 if (!ctx) return 0;

 graphes[idCanvas] = new Chart(ctx, {
   type: "line",
   data: { datasets: courbes },
   options: { 
     responsive: true,
     interaction: { mode: "index", intersect: false },
     scales: {
       x: {
         type: 'time',
         time: {
           tooltipFormat: 'dd/MM/yyyy HH:mm',
           displayFormats: {
             minute: 'HH:mm',
             hour: 'dd/MM HH:mm',
             day: 'dd/MM'
           }
         },
         ticks: {
           maxTicksLimit: 8,
           autoSkip: true
         }
       }
     }
   },
 });
 return courbes.length;
}

// Met à jour l'affichage global
function actualiserAffichageInterface() {
  if (!pointsGlobal || pointsGlobal.length === 0) return;

  const pmCoches = getCoches('filtre-pm');
  const meteoCoches = getCoches('filtre-meteo');

  dessinerGraphe("graphe-pm", "carte-pm", pointsGlobal, pmCoches, ["pm1", "pm25", "pm10"]);
  dessinerGraphe("graphe-meteo", "carte-meteo", pointsGlobal, meteoCoches, ["temp", "hum"]);
  dessinerGraphe("graphe-co2", "carte-co2", pointsGlobal, ["co2"], ["co2"]);
}

// Affiche la valeur la plus récente de chaque champ coché
function afficherDerniere(points) {
 if (!points || points.length === 0) return;
 const derniere = points[points.length - 1];
 const tousCoches = [...getCoches('filtre-pm'), ...getCoches('filtre-meteo'), 'co2'];
 
 const html = Object.keys(CHAMPS)
 .filter(c => derniere[c] !== undefined && tousCoches.includes(c))
 .map(c => {
   const [nom, unite] = CHAMPS[c];
   const valeur = Number(derniere[c]).toFixed(c === "co2" ? 0 : 1);
   return `<div class="valeur">${nom}<b>${valeur} ${unite}</b></div>`;
 });
 
 document.getElementById("valeurs").innerHTML = html.length > 0 ? html.join("") : "Aucun champ sélectionné";
}

async function rafraichir() {
 const etat = document.getElementById("etat");
 const periode = document.getElementById("periode").value;
 etat.className = "";
 etat.textContent = "Chargement en cours...";
 
 try {
   pointsGlobal = await chargerMesures(periode);
   if (!pointsGlobal || pointsGlobal.length === 0) {
     etat.textContent = "Aucune mesure sur cette période pour votre carte.";
     document.getElementById("valeurs").innerHTML = "Aucune donnée disponible";
     return;
   }
   
   afficherDerniere(pointsGlobal);
   actualiserAffichageInterface();
   
   const date = parseDate(pointsGlobal[pointsGlobal.length - 1].time).toLocaleString("fr-FR", { timeZone: "Europe/Paris" });
   etat.className = "";
   etat.textContent = `Succès : ${pointsGlobal.length} points affichés. Dernière mesure : ${date}.`;
 } catch (erreur) {
   etat.className = "erreur";
   etat.textContent = "Erreur de chargement : " + erreur.message;
   console.error(erreur);
 }
}

// Écouteurs d'événements
document.getElementById("periode").addEventListener("change", rafraichir);

// Met à jour les graphiques dès qu'on coche/décoche une case
document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
  checkbox.addEventListener('change', () => {
    actualiserAffichageInterface();
    afficherDerniere(pointsGlobal);
  });
});

// Lancement direct et mise à jour automatique toutes les 5 minutes
rafraichir();
setInterval(rafraichir, 5 * 60 * 1000);
</script>
</body>
</html>
