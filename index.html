<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notre capteur</title>
<!-- Chart.js et son adaptateur de dates -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
body {
  font-family: system-ui, sans-serif; color: #1b2420; background: #f6f7f6;
  max-width: 900px; margin: 0 auto; padding: 16px;
}
h1 { margin-bottom: 4px; }
.carte {
  background: #fff; border: 1px solid #d6ddd8; border-radius: 8px;
  padding: 12px 16px; margin: 16px 0;
}
#valeurs { display: flex; flex-wrap: wrap; gap: 24px; }
.valeur b { display: block; font-size: 1.8rem; }
#etat { color: #5a6a60; font-weight: 500; }
#etat.erreur { color: #b3261e; }
</style>
</head>
<body>
<h1>Notre capteur</h1>
<p>Mesures envoyées par la carte du groupe au serveur AirCarto.</p>
<p>
 Période :
 <select id="periode">
  <option value="-1h">1 dernière heure</option>
  <option value="-6h">6 dernières heures</option>
  <option value="-24h" selected>24 dernières heures</option>
  <option value="-7d">7 derniers jours</option>
 </select>
</p>
<p id="etat">Chargement en cours...</p>
<div class="carte">
 <h2>Dernière mesure</h2>
 <div id="valeurs">En attente des données...</div>
</div>
<div class="carte">
 <h2>Particules (µg/m³)</h2>
 <canvas id="graphe-pm"></canvas>
</div>
<div class="carte">
 <h2>Température (°C) et humidité (%)</h2>
 <canvas id="graphe-meteo"></canvas>
</div>
<div class="carte" id="carte-co2">
 <h2>CO₂ (ppm)</h2>
 <canvas id="graphe-co2"></canvas>
</div>

<script>
// ---------- RÉGLAGES : Mettez votre clé ici ----------
const CLE = "1fdf17de86d313e5f49e03ab36f0360b"; // Remplacez par votre clé de groupe (32 caractères)
const DEVICE_ID = ""; // Laissez vide pour toutes les cartes

// Moyenne par intervalle selon la période
const MOYENNE = { "-1h": "1m", "-6h": "5m", "-24h": "15m", "-7d": "1h" };

// Nom affiché et unité de chaque champ de l'API
const CHAMPS = {
 pm1: ["PM1", "µg/m³"], pm25: ["PM2.5", "µg/m³"], pm10: ["PM10", "µg/m³"],
 temp: ["Température", "°C"], hum: ["Humidité", "%"], co2: ["CO₂", "ppm"],
};
const graphes = {};

// Demande les mesures au serveur et trie chronologiquement du plus ancien au plus récent
async function chargerMesures(periode) {
 const params = new URLSearchParams({ key: CLE, start: periode, freq: MOYENNE[periode] });
 if (DEVICE_ID) params.set("device_id", DEVICE_ID);
 
 const url = "https://api.aircarto.fr/iut-amu/data?" + params.toString();
 const reponse = await fetch(url);
 
 if (!reponse.ok) {
   throw new Error("Erreur HTTP : " + reponse.status);
 }
 
 const json = await reponse.json();
 if (!json.ok) {
   throw new Error(json.message || "Erreur renvoyée par l'API");
 }
 
 let points = json.points || [];
 
 // S'assure que les points sont bien triés du plus ancien au plus récent
 points.sort((a, b) => new Date(a.time) - new Date(b.time));
 
 return points;
}

// Dessine un graphe avec un axe temporel strict de gauche à droite
function dessiner(idCanvas, points, champs) {
 if (typeof Chart === 'undefined') {
   console.error("Chart.js n'est pas chargé !");
   return 0;
 }
 
 const courbes = champs
 .filter(c => points.some(p => p[c] !== undefined))
 .map(c => ({
   label: CHAMPS[c][0],
   data: points.map(p => ({
     x: new Date(p.time),
     y: p[c] ?? null
   })),
   pointRadius: points.length < 15 ? 4 : 2,
   borderWidth: 2,
   spanGaps: true
 }));

 if (graphes[idCanvas]) {
   graphes[idCanvas].destroy();
 }
 
 const ctx = document.getElementById(idCanvas);
 if (!ctx) return 0;

 graphes[idCanvas] = new Chart(ctx, {
   type: "line",
   data: { datasets: courbes },
   options: { 
     responsive: true,
     interaction: { mode: "index", intersect: false },
     scales: {
       x: {
         type: 'time',
         time: {
           tooltipFormat: 'dd/MM/yyyy HH:mm',
           displayFormats: {
             minute: 'dd/MM HH:mm',
             hour: 'dd/MM HH:mm',
             day: 'dd/MM',
             week: 'dd/MM'
           }
         },
         ticks: {
           maxTicksLimit: 8,
           autoSkip: true
         }
       }
     }
   },
 });
 return courbes.length;
}

// Affiche la valeur la plus récente de chaque champ
function afficherDerniere(points) {
 if (!points || points.length === 0) return;
 const derniere = points[points.length - 1];
 const html = Object.keys(CHAMPS)
 .filter(c => derniere[c] !== undefined)
 .map(c => {
   const [nom, unite] = CHAMPS[c];
   const valeur = Number(derniere[c]).toFixed(c === "co2" ? 0 : 1);
   return `<div class="valeur">${nom}<b>${valeur} ${unite}</b></div>`;
 });
 document.getElementById("valeurs").innerHTML = html.join("");
}

async function rafraichir() {
 const etat = document.getElementById("etat");
 const periode = document.getElementById("periode").value;
 etat.className = "";
 etat.textContent = "Chargement en cours...";
 
 try {
   const points = await chargerMesures(periode);
   if (!points || points.length === 0) {
     etat.textContent = "Aucune mesure sur cette période : essayez de sélectionner '24 dernières heures'.";
     document.getElementById("valeurs").innerHTML = "Aucune donnée disponible";
     return;
   }
   
   afficherDerniere(points);
   dessiner("graphe-pm", points, ["pm1", "pm25", "pm10"]);
   dessiner("graphe-meteo", points, ["temp", "hum"]);
   const avecCo2 = dessiner("graphe-co2", points, ["co2"]);
   
   const carteCo2 = document.getElementById("carte-co2");
   if (carteCo2) carteCo2.hidden = (avecCo2 === 0);
   
   const date = new Date(points[points.length - 1].time).toLocaleString("fr-FR", { timeZone: "Europe/Paris" });
   etat.className = "";
   etat.textContent = `Succès : ${points.length} points affichés. Dernière mesure : ${date}.`;
 } catch (erreur) {
   etat.className = "erreur";
   etat.textContent = "Erreur de chargement : " + erreur.message;
   console.error(erreur);
 }
}

document.getElementById("periode").addEventListener("change", rafraichir);

// Lancement direct et mise à jour automatique
rafraichir();
setInterval(rafraichir, 5 * 60 * 1000);
</script>
</body>
</html>
